<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #canvas { position: fixed; inset: 0; }
    #canvas canvas { display: block; }
    #diag {
      position: fixed; left: 8px; bottom: 6px; right: 8px;
      font: 9px/1.3 -apple-system, sans-serif; color: #8fa4b8;
      pointer-events: none; white-space: pre-wrap;
    }
  </style>
  <script>
    // 非模块脚本：即使模块加载失败也能证明页面已启动
    window.__stage = function (text) {
      var el = document.getElementById('diag');
      if (el) el.textContent = text;
      try { window.webkit.messageHandlers.car3d.postMessage(text); } catch (e) {}
    };
    window.addEventListener('error', function (e) {
      window.__stage('jserror: ' + (e.message || e.type));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var reason = e.reason && (e.reason.message || e.reason);
      window.__stage('rejection: ' + reason);
    });
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas"></div>
  <div id="diag">boot</div>
  <script>
    window.__stage('page-loaded');
    document.addEventListener('DOMContentLoaded', function () { window.__stage('dom-ready'); });
  </script>
  <script type="module" src="./car3d.js"></script>
</body>
</html>
