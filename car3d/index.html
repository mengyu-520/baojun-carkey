<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #canvas { position: fixed; inset: 0; }
    #canvas canvas { display: block; }
    #diag {
      position: fixed; left: 10px; bottom: 8px; right: 10px;
      font: 9px/1.3 -apple-system, sans-serif; color: #7c8b9b;
      pointer-events: none; white-space: pre-wrap;
    }
  </style>
  <script>
    window.__stage = function (text) {
      window.__lastStage = text;
      var el = document.getElementById('diag');
      if (el) el.textContent = text;
      try { window.webkit.messageHandlers.car3d.postMessage(text); } catch (e) {}
    };
    window.addEventListener('error', function (e) {
      window.__stage('jserror: ' + (e.message || e.type));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var reason = e.reason && (e.reason.message || e.reason);
      window.__stage('rejection: ' + reason);
    });
  </script>
</head>
<body>
  <div id="canvas"></div>
  <div id="diag">boot</div>
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <script src="./vendor/GLTFLoader.js"></script>
  <script src="./model-data.js"></script>
  <script src="./car3d.js"></script>
</body>
</html>
